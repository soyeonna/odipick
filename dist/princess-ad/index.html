<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>대전공주 광고</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<link rel="apple-touch-icon" sizes="180x180" href="icon.png">
<meta name="apple-mobile-web-app-title" content="대전공주 광고">
<meta name="theme-color" content="#ff5fa6">
<style>
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif; background:#fff6fa; color:#2a1720; display:flex; min-height:100vh; align-items:center; justify-content:center; text-align:center; padding:24px; }
  .box { max-width:360px; }
  img { width:120px; height:120px; border-radius:28px; box-shadow:0 4px 14px rgba(214,53,127,.25); }
  h1 { font-size:20px; color:#d6357f; margin:16px 0 8px; }
  p { color:#8c6b7a; font-size:14px; line-height:1.6; margin:6px 0; }
  a.btn { display:block; margin:18px 0 10px; padding:14px; background:#ff5fa6; color:#fff; border-radius:12px; font-weight:700; text-decoration:none; font-size:16px; }
  .small { font-size:12px; }
  b { color:#2a1720; }
</style>
</head>
<body>
<div class="box">
  <img src="icon-512.png" alt="대전공주">
  <h1>대전공주 광고 관리</h1>
  <p id="msg">앱으로 이동 중…</p>
  <a class="btn" id="go" href="https://script.google.com/macros/s/AKfycbx0rGHOJkGe0ssu6ZAi8r_xGcFY4X829w2_EpyZBlb5QPVrDoD1N5JRHaR-wtHeGHq-bg/exec">앱 열기</a>
  <p class="small" id="howto"></p>
</div>
<script>
(function () {
  var APP = document.getElementById('go').href;
  var standalone = window.navigator.standalone === true;
  var flagged = /[?&]app=1/.test(location.search);
  // 홈 화면 아이콘으로 열면(주소에 app=1이 붙어 있음) 바로 앱으로 이동
  if (standalone || flagged) { location.replace(APP); return; }
  // 처음 방문: 주소에 app=1을 붙여 두면 "홈 화면에 추가"가 이 주소를 저장함
  try { history.replaceState(null, '', location.pathname + '?app=1'); } catch (e) {}
  document.getElementById('msg').innerHTML = '이 페이지를 <b>홈 화면에 추가</b>하면 대전공주 아이콘으로 앱이 열려요.';
  document.getElementById('howto').innerHTML = 'Safari 아래 <b>공유</b> 버튼 → <b>홈 화면에 추가</b> → 추가.<br>그다음부터는 아이콘만 누르면 바로 앱이 열립니다.';
})();
</script>
</body>
</html>
