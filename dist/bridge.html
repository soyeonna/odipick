<!doctype html><meta charset="utf-8"><title>bridge</title>
<body style="font:14px sans-serif;padding:8px">준비됨 <b id="s">0</b>
<script>
var U='https://ntmzjsozgxjeywmwsniu.supabase.co';
var K='sb_publishable_nrg1ZgAnvhvAODdGHQmN4w_vfzO5_bb';
addEventListener('message', async function(e){
  var d=e.data; if(!d||typeof d!=='object'||!d.__covers) return;
  var ent=Object.entries(d.__covers), ch=[], i;
  for(i=0;i<ent.length;i+=25) ch.push(Object.fromEntries(ent.slice(i,i+25)));
  var ok=0;
  for(i=0;i<ch.length;i++){
    try{
      var r=await fetch(U+'/rest/v1/recommendation_logs',{method:'POST',
        headers:{'apikey':K,'Authorization':'Bearer '+K,'Content-Type':'application/json'},
        body:JSON.stringify({query:'__cover2__', parsed_conditions:ch[i], result_count:i})});
      if(r.ok) ok++;
    }catch(err){}
    document.getElementById('s').textContent=ok+'/'+ch.length;
  }
  if(e.source) e.source.postMessage({__bridgeDone:ok+'/'+ch.length},'*');
});
</script>
