<title>오디픽</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@400;500;700;800;900&family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#F7F8FA; --card:#FFFFFF; --sub:#EEF0F3; --line:#E5E8EB; --line2:#D4D9DE;
  --ink:#191919; --ink2:#767676; --ink3:#A0A5AB;
  --brand:#FF3F7F; --brand-w:#FFF0F5; --brand-d:#D81B60; --on-brand:#FFFFFF;
  --ok:#0F8A5F; --ok-w:#E6F6EF; --warn:#B7791F; --warn-w:#FEF6E6; --err:#D64545;
  --r:16px; --r-s:10px; --nav:58px;
  --sh:0 1px 2px rgba(25,25,25,.05);
}
*{box-sizing:border-box}
html,body{overflow-x:clip; max-width:100%}
body{background:var(--bg); color:var(--ink); font-size:15px; line-height:1.6;
  font-family:"IBM Plex Sans KR","Apple SD Gothic Neo",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased; -webkit-tap-highlight-color:transparent;
  padding-bottom:calc(var(--nav) + env(safe-area-inset-bottom))}
button,input,textarea,select{font:inherit; color:inherit}
button{cursor:pointer; border:0; background:none}
h1,h2,h3{font-family:"Gothic A1",sans-serif; margin:0; letter-spacing:-.03em; text-wrap:balance}
img{max-width:100%}
:focus-visible{outline:2.5px solid var(--brand); outline-offset:2px; border-radius:8px}
.wrap{max-width:640px; margin:0 auto; padding:0 16px}
[hidden]{display:none!important}

/* ── 헤더 ── */
header.top{position:sticky; top:0; z-index:40; background:var(--bg);
  padding-top:env(safe-area-inset-top); border-bottom:1px solid transparent; transition:border-color .2s}
header.top.stuck{border-color:var(--line)}
.topin{max-width:640px; margin:0 auto; height:56px; padding:0 16px; display:flex; align-items:center; gap:8px}
.wmbtn{display:block; padding:4px 2px; border-radius:8px; flex-shrink:0}
.wmbtn:hover{background:var(--sub)}
.wmbtn:active{transform:scale(.96)}
.wm{height:26px; width:auto; display:block}
.wmko{font-size:11.5px; font-weight:500; color:var(--ink3); letter-spacing:.02em;
  margin:6px 2px 0 -1px; align-self:center}
.gsel{display:inline-flex; align-items:center; gap:3px; height:26px; padding:0 9px; border-radius:8px;
  font-weight:700; font-size:12.5px; background:var(--brand-w); color:var(--brand-d)}
.gsel:active{transform:scale(.95)}
.gsel .cv{font-size:8.5px; color:var(--brand-d); opacity:.7}
.slogan{font-size:12.5px; color:var(--ink2); margin-left:2px}
@media (max-width:767px){.slogan{display:none}}
.topact{margin-left:auto; display:flex; gap:2px}
/* 목록 탭 빠른 필터 — 라벨 붙은 두 줄 */
.qfil{display:flex; flex-direction:column; gap:6px; margin-top:2px}
.fgrp{display:flex; align-items:center; gap:8px; min-width:0}
.fglbl{flex-shrink:0; width:30px; font-size:11px; font-weight:600; color:var(--ink3)}
.fgsc{display:flex; gap:6px; overflow-x:auto; scrollbar-width:none; padding:2px 0}
.fgsc::-webkit-scrollbar{display:none}
.fgsc .srt{flex-shrink:0}
/* 터치 영역 확보 (엄지 기준 최소 크기) */
.srt,.fc,.cchip{min-height:38px}
.nb{min-height:48px}
@supports(padding:max(0px)){
  .nav{padding-bottom:max(0px, env(safe-area-inset-bottom))}
}
/* 뒤로가기 버튼이 생겨도 상단 글자가 세로로 쪼개지지 않게 */
.wmko,.gsel{white-space:nowrap; flex-shrink:0}
.wmbtn{min-width:0}
.slogan{white-space:nowrap; overflow:hidden}

.iconbtn{width:44px; height:44px; font-size:20px; display:grid; place-items:center; border-radius:10px; color:var(--ink2)}
.iconbtn:hover{background:var(--sub); color:var(--ink)}
.iconbtn.on{color:var(--brand)}

/* ── 화면 전환 ── */
.screen{display:none}
.screen.on{display:block; animation:fade .22s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}

/* ── 홈 ── */
.hero{padding:20px 0 4px}
.hero h1{font-size:clamp(30px,8.4vw,36px); font-weight:900; line-height:1.22}
.hero h1 em{font-style:normal; color:var(--brand)}
.hero p{margin:8px 0 0; font-size:14.5px; color:var(--ink2); line-height:1.55}

/* ── 검색창 ── */
.sbar{display:flex; align-items:center; gap:8px; height:56px; background:var(--card);
  border:1.5px solid var(--line2); border-radius:18px; padding:0 6px 0 16px; margin-top:16px;
  transition:border-color .18s}
.sbar:focus-within{border-color:var(--brand)}
.sbar .si{color:var(--ink3); flex-shrink:0; display:grid; place-items:center}
.sbar input{flex:1; min-width:0; height:52px; border:0; background:none; font-size:16px}
.sbar input:focus{outline:none}
.sbar input::placeholder{color:transparent}
.sgo{width:44px; height:44px; border-radius:13px; background:var(--brand); color:var(--on-brand);
  display:grid; place-items:center; flex-shrink:0; transition:transform .12s, filter .15s}
.sgo:hover{filter:brightness(1.05)} .sgo:active{transform:scale(.93)}
.sgo:disabled{opacity:.35; cursor:default}
.swrap{position:relative}
.ph{position:absolute; left:44px; right:60px; top:50%; transform:translateY(-50%); pointer-events:none;
  color:var(--ink3); font-size:16px; transition:opacity .35s; overflow:hidden;
  white-space:nowrap; text-overflow:ellipsis}
.swrap.typed .ph{display:none}

/* ── 칩 가로 스크롤 ── */
.situgrid{display:grid; grid-template-columns:repeat(3,1fr); gap:7px; padding-top:14px}
@media (min-width:480px){.situgrid{grid-template-columns:repeat(6,1fr)}}
.situgrid .chip{width:100%; justify-content:center; padding:0 6px}
.chiprow{display:flex; gap:7px; overflow-x:auto; padding:14px 16px 2px; margin:0 -16px;
  scrollbar-width:none; -webkit-overflow-scrolling:touch}
.chiprow::-webkit-scrollbar{display:none}
.chip{flex-shrink:0; min-height:40px; display:inline-flex; align-items:center; gap:6px;
  padding:0 15px; border-radius:20px; border:1px solid var(--line2); background:var(--card);
  font-size:14px; font-weight:600; color:var(--ink2); white-space:nowrap; transition:all .14s}
.chip:hover{border-color:var(--brand); color:var(--brand)}
.chip:active{transform:scale(.96)}
.chip[aria-pressed="true"]{background:var(--brand); border-color:var(--brand); color:var(--on-brand)}
.chip[aria-pressed="true"] .ci{color:var(--on-brand)}
.chip[aria-pressed="true"]::before{content:"✓"; font-size:12px}
.ci{color:var(--brand); display:grid; place-items:center}
.ci svg{width:17px; height:17px}
.chip.pk{border-color:var(--brand); background:var(--brand-w); color:var(--brand-d)}
.chip.pk[aria-pressed="true"]{background:var(--brand); color:var(--on-brand)}

/* ── 섹션 ── */
section.blk{margin-top:26px}
.blkh{display:flex; align-items:baseline; gap:8px; margin-bottom:10px}
.blkh h2{font-size:18px; font-weight:800}
.blkh .more{margin-left:auto; font-size:13px; color:var(--ink2); font-weight:500}
.blkp{font-size:13.5px; color:var(--ink2); margin:0 0 12px; line-height:1.55}

/* ── 조건 칩 (분석 결과) ── */
.cond{display:flex; gap:6px; flex-wrap:wrap; margin:12px 0}
.rescnt{font-size:13px; color:var(--ink2); margin:0 0 10px}
.rescnt b{color:var(--brand); font-weight:800}
.cchip{display:inline-flex; align-items:center; gap:6px; height:34px; padding:0 8px 0 13px;
  border-radius:17px; background:var(--brand-w); color:var(--brand-d); font-size:13.5px; font-weight:600;
  border:1px solid var(--brand)}
.cchip b{font-weight:400; font-size:15px; opacity:.65; padding:0 2px}
.cchip:hover b{opacity:1}

/* ── 정렬/필터 줄 ── */
.sorts{display:flex; gap:6px; overflow-x:auto; padding-bottom:2px; scrollbar-width:none}
.sorts::-webkit-scrollbar{display:none}
.srt{flex-shrink:0; min-height:36px; padding:0 13px; border-radius:8px; border:1px solid var(--line2);
  background:var(--card); font-size:13.5px; font-weight:600; color:var(--ink2); white-space:nowrap}
.srt[aria-pressed="true"]{background:var(--ink); border-color:var(--ink); color:var(--bg)}
.viewtog{margin-left:auto; flex-shrink:0; display:inline-flex; align-items:center; gap:5px;
  min-height:36px; padding:0 13px; border-radius:8px; background:var(--ink); color:var(--bg);
  font-size:13.5px; font-weight:700}

/* ── 결과 카드 ── */
.cards{display:flex; flex-direction:column; gap:10px; margin-top:12px}
.card{width:100%; text-align:left; background:var(--card); border-radius:var(--r); padding:14px;
  display:flex; gap:12px; box-shadow:var(--sh); transition:transform .15s}
.card:active{transform:scale(.99)}
.thumb{width:78px; aspect-ratio:3/4; height:auto; border-radius:12px; object-fit:cover;
  flex-shrink:0; background:var(--sub); align-self:flex-start}
.thumb.ph2{display:grid; place-items:center; min-height:104px; color:var(--brand); position:relative; overflow:hidden;
  background:var(--brand-w); border:1px solid var(--line)}
.thumb.ph2 svg{opacity:.75}
.dhero.noimg{display:grid; place-items:center; aspect-ratio:16/7; background:var(--brand-w); color:var(--brand)}
.dhero.noimg svg{width:44px; height:44px; opacity:.7}
.cbody{flex:1; min-width:0; display:flex; flex-direction:column; gap:4px}
.crow1{display:flex; align-items:center; gap:6px; flex-wrap:wrap}
.rank{width:20px; height:20px; border-radius:6px; background:var(--ink); color:var(--bg);
  display:grid; place-items:center; font-size:11.5px; font-weight:700; flex-shrink:0;
  font-family:"IBM Plex Mono",monospace}
.rank.n1{background:var(--brand); color:var(--on-brand)}
.nm{font-family:"Gothic A1",sans-serif; font-size:16.5px; font-weight:800; letter-spacing:-.02em;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:100%}
.pick{display:inline-flex; align-items:center; gap:3px; height:20px; padding:0 7px; border-radius:5px;
  background:var(--brand); color:var(--on-brand); font-size:10.5px; font-weight:800; white-space:nowrap}
.meta{font-size:12.5px; color:var(--ink2); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.stat{display:inline-flex; align-items:center; gap:4px; font-size:12px; font-weight:700}
.stat.open{color:var(--ok)} .stat.shut{color:var(--err)} .stat.unk{color:var(--ink3); font-weight:500}
.stat i{width:5px; height:5px; border-radius:50%; background:currentColor; display:block}
.why{font-size:13px; color:var(--ink); line-height:1.5}
.hits{display:flex; gap:5px; flex-wrap:wrap}
.hit{font-size:11.5px; padding:2px 7px; border-radius:5px; background:var(--ok-w); color:var(--ok); font-weight:600}
.caution{font-size:12px; color:var(--warn); background:var(--warn-w); border-radius:6px; padding:5px 8px; line-height:1.45}
.cact{display:flex; gap:6px; margin-top:2px}
.sv{width:34px; height:34px; border-radius:9px; border:1px solid var(--line2); display:grid;
  place-items:center; color:var(--ink3); flex-shrink:0}
.sv.on{color:var(--brand); border-color:var(--brand); background:var(--brand-w)}

function openAiSheet(){
  openSheet('<h2 class="dtitle" style="font-size:20px;margin:4px 0 6px">AI 추천</h2>'+
    '<p class="srcline" style="margin:0 0 12px">상황을 문장 그대로 적으면 조건을 알아듣고 골라드려요.<br>'+
    '예) 둔산동에서 부모님 모시고 갈 조용한 한식집 · 주차되는 룸 있는 고깃집 8명</p>'+
    '<div class="sbar" style="margin:0">'+
      '<input id="qai" type="text" autocomplete="off" enterkeyhint="search" '+
        'style="font-size:17px" aria-label="상황을 입력하세요" placeholder="오늘 어떤 자리인가요?">'+
      '<button class="sgo" id="goai" aria-label="추천받기">'+ic(I.arrow,18)+'</button>'+
    '</div>');
  var inp=document.getElementById('qai');
  function go(){ var v=inp.value.trim(); if(!v) return;
    closeSheet(function(){ document.getElementById('q').value=v; runSearch(v); }); }
  document.getElementById('goai').addEventListener('click',go);
  inp.addEventListener('keydown',function(e){ if(e.key==='Enter') go(); });
  setTimeout(function(){ inp.focus(); },150);
}
/* ── 바텀시트 ── */
.scrim{position:fixed; inset:0; background:rgba(15,17,20,.45); opacity:0; pointer-events:none;
  transition:opacity .26s; z-index:60}
.scrim.on{opacity:1; pointer-events:auto}
.sheet{position:fixed; left:0; right:0; bottom:0; z-index:61; background:var(--card); will-change:transform;
  border-radius:20px 20px 0 0; max-height:92vh; display:flex; flex-direction:column;
  transform:translateY(101%); transition:transform .3s cubic-bezier(.2,.8,.25,1)}
.sheet.on{transform:none}
.grab{padding:9px 0 5px; display:grid; place-items:center; flex-shrink:0; touch-action:none; cursor:grab}
.grab i{width:36px; height:4px; border-radius:3px; background:var(--line2); display:block}
.sheetbody{overflow-y:auto; padding:0 16px calc(20px + env(safe-area-inset-bottom));
  max-width:640px; margin:0 auto; width:100%}
.sheetfoot{flex-shrink:0; display:flex; gap:8px; padding:12px 16px calc(12px + env(safe-area-inset-bottom));
  border-top:1px solid var(--line); background:var(--card); max-width:640px; margin:0 auto; width:100%}

/* ── 버튼 ── */
.btn{min-height:48px; border-radius:12px; font-family:"Gothic A1",sans-serif; font-weight:800;
  font-size:15px; display:inline-flex; align-items:center; justify-content:center; gap:6px;
  padding:0 18px; transition:transform .12s; text-decoration:none}
.btn:active{transform:scale(.98)}
.btn.p{background:var(--brand); color:var(--on-brand); flex:1}
.btn.s{background:var(--sub); color:var(--ink); flex:1}
.btn.o{border:1px solid var(--line2); color:var(--ink2); background:var(--card)}

/* ── 필터 시트 ── */
.fg{padding:16px 0; border-bottom:1px solid var(--line)}
.fg:last-of-type{border-bottom:0}
.fgh{font-size:14px; font-weight:800; margin-bottom:9px; font-family:"Gothic A1",sans-serif}
.fgc{display:flex; gap:6px; flex-wrap:wrap}
.fc{min-height:38px; padding:0 13px; border-radius:9px; border:1px solid var(--line2);
  background:var(--card); font-size:13.5px; color:var(--ink2); display:inline-flex;
  align-items:center; gap:5px; transition:all .14s}
.fc[aria-pressed="true"]{background:var(--brand); border-color:var(--brand); color:var(--on-brand); font-weight:700}
.fc .n{font-family:"IBM Plex Mono",monospace; font-size:10.5px; opacity:.6}
.fc.z{opacity:.4}

/* ── 상세 ── */
.vcard{display:flex; align-items:center; gap:12px; background:var(--sub); border-radius:14px;
  padding:10px 12px; text-decoration:none; color:inherit}
.vcard:active{transform:scale(.99)}
.vcard img{width:52px; height:66px; border-radius:9px; object-fit:cover; flex-shrink:0}
.vcard .vph{width:52px; height:66px; border-radius:9px; background:var(--brand-w);
  display:grid; place-items:center; color:var(--brand); flex-shrink:0}
.vcard .vb{flex:1; min-width:0}
.vcard .vb b{display:block; font-size:14.5px; font-weight:700}
.vcard .vb span{font-size:12.5px; color:var(--ink2)}
.vcard .vplay{width:30px; height:30px; border-radius:50%; background:var(--brand); color:var(--on-brand);
  display:grid; place-items:center; flex-shrink:0}
.dhero{margin:0 -16px 14px; background:var(--sub); aspect-ratio:4/3; overflow:hidden; position:relative}
.dhero img{width:100%; height:100%; object-fit:cover}
.dtitle{font-size:23px; font-weight:900; letter-spacing:-.03em; line-height:1.3}
.dmeta{font-size:13.5px; color:var(--ink2); margin-top:4px}
.dsec{margin-top:20px}
.dsec h3{font-size:15px; font-weight:800; margin-bottom:8px}
.dbox{background:var(--sub); border-radius:12px; padding:13px 15px; font-size:14px; line-height:1.6; color:var(--ink)}
.dl{display:grid; grid-template-columns:auto 1fr; gap:9px 14px; font-size:14px}
.dl dt{color:var(--ink2); white-space:nowrap}
.dl dd{margin:0; word-break:break-word}
.srcline{font-size:12px; color:var(--ink3); margin-top:16px; line-height:1.55}

/* ── 지도 ── */
.mapscreen{position:relative; height:calc(100vh - 56px - var(--nav)); min-height:420px}
.mapcanvas{position:absolute; inset:0; background:var(--sub); display:grid; place-items:center}
.mapover{position:absolute; left:0; right:0; top:0; padding:10px 16px; display:flex;
  flex-direction:column; gap:8px; pointer-events:none}
.mapover>*{pointer-events:auto}
.mapbtns{position:absolute; right:16px; bottom:16px; display:flex; flex-direction:column; gap:8px}
.fab{width:46px; height:46px; border-radius:14px; background:var(--card); box-shadow:0 2px 10px rgba(0,0,0,.14);
  display:grid; place-items:center; color:var(--ink)}
.redo{position:absolute; left:50%; top:118px; transform:translateX(-50%); background:var(--card);
  border-radius:20px; padding:9px 16px; font-size:13.5px; font-weight:700; box-shadow:0 2px 10px rgba(0,0,0,.14);
  display:inline-flex; align-items:center; gap:6px; white-space:nowrap}

/* ── 상태 ── */
.state{padding:44px 20px; text-align:center; display:flex; flex-direction:column;
  align-items:center; gap:10px}
.state .ico{width:52px; height:52px; border-radius:16px; background:var(--sub); display:grid;
  place-items:center; color:var(--ink3)}
.state h3{font-size:17px; font-weight:800}
.state p{margin:0; font-size:14px; color:var(--ink2); max-width:30ch; line-height:1.6}
.skel{display:flex; flex-direction:column; gap:10px; margin-top:12px}
.sk{background:var(--card); border-radius:var(--r); padding:14px; display:flex; gap:12px}
.sk .b{background:var(--sub); border-radius:8px; animation:pulse 1.2s ease-in-out infinite}
.sk .b1{width:78px; aspect-ratio:3/4; border-radius:12px; flex-shrink:0}
.sk .col{flex:1; display:flex; flex-direction:column; gap:8px; padding-top:4px}
.sk .b2{height:17px; width:58%} .sk .b3{height:13px; width:40%} .sk .b4{height:13px; width:86%}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
.loadmsg{text-align:center; font-size:14px; color:var(--ink2); padding:14px 0 2px; font-weight:600}

/* ── 릴스 ── */
.shelf{display:flex; gap:8px; overflow-x:auto; padding:0 16px 6px; margin:0 -16px; scrollbar-width:none;
  scroll-snap-type:x proximity}
.shelf::-webkit-scrollbar{display:none}
.rt{flex-shrink:0; width:41vw; max-width:150px; aspect-ratio:3/4; border-radius:12px; overflow:hidden;
  position:relative; background:var(--sub); scroll-snap-align:start}
.rt img{width:100%; height:100%; object-fit:cover; display:block}
.rt .rc{position:absolute; left:0; right:0; bottom:0; padding:20px 8px 8px; text-align:left;
  background:linear-gradient(transparent,rgba(0,0,0,.82)); color:#fff; font-size:9.5px; line-height:1.3;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden}
.rt .rc b{display:block; font-size:11px; font-weight:700; margin-bottom:2px;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.rt .pl{position:absolute; right:7px; top:7px; width:24px; height:24px; border-radius:50%;
  background:rgba(255,255,255,.92); color:var(--brand-d); display:grid; place-items:center}
.rt .pl svg{width:12px; height:12px}


/* 히어로 대전공주 버튼 */
.hero{position:relative}
.pbtn{position:absolute; right:0; top:22px; display:flex; flex-direction:column; align-items:center; gap:4px}
.pbtn img{width:58px; height:58px; border-radius:50%; object-fit:cover; border:2.5px solid var(--brand)}
.pbtn span{font-size:11px; font-weight:700; color:var(--brand-d)}
.pbtn:active{transform:scale(.94)}
/* 오늘의 추천 */
.airec{display:flex; flex-direction:column; gap:8px}
.ai{width:100%; text-align:left; background:var(--card); border-radius:14px; padding:14px 15px;
  display:flex; align-items:center; gap:12px; box-shadow:var(--sh)}
.ai:active{transform:scale(.985)}
.ai .aico{width:40px; height:40px; border-radius:12px; background:var(--brand-w); color:var(--brand-d);
  display:grid; place-items:center; flex-shrink:0}
.ai .at1{font-size:14.5px; font-weight:700}

/* 장소 유형 — 밥집 검색에 뷰티·쇼핑·체험이 끼지 않게 */
function ptypeOf(p){
  var c=p.cats||[];
  if(c.indexOf('뷰티')>-1) return 'beauty';
  if(c.indexOf('체험')>-1||c.indexOf('나들이')>-1) return 'play';
  if(p.cat==='쇼핑'||p.cat==='아울렛') return 'shop';
  var food=['한식','중식','일식','분식','양식','고기'].some(function(x){return c.indexOf(x)>-1;});
  if(!food && (c.indexOf('카페')>-1||c.indexOf('디저트')>-1)) return 'cafe';
  if(!food && c.indexOf('술집')>-1) return 'bar';
  return 'rest';
}
/* 특정 시각(분)에 영업하는지. 모르면 null */
function openAtMin(p, min){
  if(!p.hours) return null;
  var m=String(p.hours).match(/(\d{1,2}):(\d{2})\s*[–~-]\s*(\d{1,2}):(\d{2})/);
  if(!m) return null;
  var a=(+m[1])*60+(+m[2]), b=(+m[3])*60+(+m[4]), cur=min;
  if(b<=a) b+=1440;
  if(cur<a) cur+=1440;
  return cur>=a && cur<b;
}
/* 동 이름 → 그 동네 가게들의 평균 좌표 (반경 판정용) */
var _DONGC={};
function dongCenter(d){
  if(d in _DONGC) return _DONGC[d];
  var xs=[],ys=[];
  P.forEach(function(p){ if(String(p.area||'').indexOf(d)===0 && p.lat){ xs.push(p.lng); ys.push(p.lat); } });
  _DONGC[d]=xs.length?{lng:xs.reduce(function(a,b){return a+b;})/xs.length,
                       lat:ys.reduce(function(a,b){return a+b;})/ys.length}:null;
  return _DONGC[d];
}
function kmBetween(a,b){
  var dx=(a.lng-b.lng)*88.8, dy=(a.lat-b.lat)*111.1;
  return Math.sqrt(dx*dx+dy*dy);
}
function budUpper(level){ return [0,10000,30000,50000,100000,1e9][level]; }
function openNow(p){
  if(!p.hours) return null;
  var m=String(p.hours).match(/(\d{1,2}):(\d{2})\s*[–~-]\s*(\d{1,2}):(\d{2})/);
  if(!m) return null;
  var now=new Date(), cur=now.getHours()*60+now.getMinutes();
  var a=(+m[1])*60+(+m[2]), b=(+m[3])*60+(+m[4]);
  if(b<=a) b+=1440;
  if(cur<a) cur+=1440;
  return cur>=a && cur<b;
}
function pct(p){ var h=0;
  if(p.sit&&p.sit.length)h++; if(p.budget!=null)h++; if(p.cap!=null)h++;
  if(p.fac&&Object.keys(p.fac).length)h++; if(p.gu)h++; if(p.hours)h++;
  return Math.round(h/6*100); }
function nActive(){ var n=0; KEYS.forEach(function(k){ n+=A[k].length; }); return n+(NEAR?1:0)+(DONGQ?1:0)+(VISIT!=null?1:0)+(typeof NEEDLE!=='undefined'&&NEEDLE.length?1:0); }

/* 추천 점수 — 기존 로직 그대로 */
function score(p){
  var hit=0,miss=0,unk=0,total=0,names=[];
  function cond(r,label){ total++;
    if(r===1){hit++; if(label)names.push(label);} else if(r===0)miss++; else unk++; }
  A.cats.forEach(function(c){ cond((p.cats||[]).indexOf(c)>-1?1:0,c); });
  A.sit.forEach(function(c){ cond((p.sit||[]).indexOf(c)>-1?1:0,c); });
  A.mood.forEach(function(c){ cond((p.mood||[]).indexOf(c)>-1?1:0,c); });
  A.gu.forEach(function(g){ cond(p.gu===g?1:0,g); });
  A.fac.forEach(function(f){ var v=(p.fac||{})[FAC[f]];
    cond(v===true?1:(v===false?0:null), f+' 확인'); });
  A.budget.forEach(function(b){ cond(p.budget==null?null:(p.budget<=BUD[b]?1:0),'예산 적합'); });
  A.cap.forEach(function(c){ cond(p.cap==null?null:(p.cap>=CAP[c]?1:0),c); });
  A.src.forEach(function(v){ cond(p.src===v?1:0,'공주픽'); });
  A.open.forEach(function(){ var o=openNow(p); cond(o==null?null:(o?1:0),'지금 영업 중'); });
  if(NEAR){
    var km=kmTo(p);
    cond(km===null?null:(km<=1.2?1:(km<=2.5?null:0)), NEAR.label+' 근처');
  }
  A.avoid.forEach(function(v){ cond((p.cats||[]).indexOf(v)>-1||(p.sit||[]).indexOf(v)>-1?0:1,null); });
  if(DONGQ){
    var inDong=String(p.area||'').indexOf(DONGQ)===0;
    cond(inDong?1:null, DONGQ);
  }
  if(NEEDLE.length){
    var hay=(p.n+' '+(p.cat||'')+' '+(p.v||'')+' '+(p.kcat||''));
    var got=NEEDLE.filter(function(w){ return hay.indexOf(w)>-1; });
    cond(got.length?1:null, got[0]||null);
  }
  var sc=hit*12-miss*7+pct(p)/20;
  if(DONGQ && String(p.area||'').indexOf(DONGQ)===0) sc+=40;   // 그 동네가 1순위, 근처는 그다음
  if(p.featured && A.sit.indexOf(p.featured)>-1) sc+=500;   // 그 상황을 골랐을 때만 1순위
  if(p.jjin) sc += (p.src==='reel' ? 30 : 22);   // 찐 대전 맛집 — 공주가 다녀온 곳 먼저
  if(A.sit.indexOf('데이트')>-1 && p.featured!=='데이트'){
    var dm=(p.mood||[]).some(function(m){ return ['예쁜','조용한','고급스러운','아늑한','테라스'].indexOf(m)>-1; });
    if(!dm) sc-=6;                               // 분위기 근거 없는 곳은 데이트 추천에서 뒤로
  }
  if(p.v)sc+=2; if(p.ig)sc+=2;
  if(p.gu&&p.gu!=='대전근교')sc+=1;
  if(NEAR){ var km2=kmTo(p); if(km2!==null) sc+=Math.max(0,(2.5-km2))*5; }  // 가까울수록 위로
  if(p.views)sc+=Math.min(4,Math.log10(p.views)-3);
  if(p.down)sc-=30;      // 운영자가 순위를 내린 곳
  if(p.closed)sc-=100;
  return {sc:sc,hit:hit,miss:miss,unk:unk,total:total,names:names};
}

}

/* ── 자연어 → 조건. AI 호출 없이 규칙으로 푼다 ── */
var NEEDLE=[], DONGQ=null;      // 자유 낱말 · 동 단위 검색
var VISIT=null, PARTY=null, BUDMAX=null;   // 방문시각(분) · 인원 · 1인 예산(원)
var RELAX={dist:false, unkFac:false, unkHours:false, unkBud:false};
function parse(t){
  KEYS.forEach(function(k){ A[k]=[]; });
  NEAR=null; NEEDLE=[]; DONGQ=null; VISIT=null; PARTY=null; BUDMAX=null;
  RELAX={dist:false, unkFac:false, unkHours:false, unkBud:false};
  Object.keys(LANDMARKS).forEach(function(k){
    if(t.indexOf(k)>-1) NEAR=LANDMARKS[k];
  });
  var dm=t.match(/([가-힣]{1,6}동)(?=\s|$|에|의|으로|쪽)/);
  if(dm) DONGQ=dm[1];
  // 인원: "4명" / "부모님 두 분과"(두 분 + 나 = 3)
  var pm=t.match(/(\d{1,2})\s*명/);
  if(pm) PARTY=+pm[1];
  else{ var bm=t.match(/(두|세|네|다섯)\s*분/);
    if(bm) PARTY={'두':2,'세':3,'네':4,'다섯':5}[bm[1]]+1; }
  // 방문 시각: "오늘 7시" "저녁 7시 반" — 10시 이하는 저녁으로 본다(아침이라 쓰면 오전)
  var tm=t.match(/(오늘|내일)?\s*(아침|오전|점심|저녁|밤|오후)?\s*(\d{1,2})\s*시\s*(반|(\d{1,2})\s*분)?/);
  if(tm && !/시간|시까지/.test(tm[0])){
    var hh=+tm[3], half=tm[4]?(tm[4]==='반'?30:+tm[5]):0, part=tm[2]||'';
    if(/아침|오전/.test(part)){} 
    else if(/점심/.test(part)){ if(hh<=3) hh+=12; }
    else if(hh<=10) hh+=12;
    VISIT=hh*60+half;
  }
  if(/새벽\s*(\d{1,2})\s*시까지/.test(t)){ var am=+RegExp.$1; VISIT=null; A.fac.indexOf('새벽')<0&&A.fac.push('새벽'); }
  // 예산: 금액을 실제로 계산. "총/N명이서 12만원"=총액, "1인당 3만원"=1인
  var won=null, per=/1\s*인당?|한\s*사람|인당|각자/.test(t);
  var wm=t.match(/(\d+(?:\.\d+)?)\s*만\s*원?/);
  if(wm) won=Math.round(parseFloat(wm[1])*10000);
  else{ var wm2=t.match(/(\d{1,3}(?:,\d{3})+|\d{4,6})\s*원/); if(wm2) won=+wm2[1].replace(/,/g,''); }
  if(won){
    BUDMAX = per||!PARTY ? won : Math.round(won/PARTY);
    var lv = BUDMAX<=10000?1:BUDMAX<=30000?2:BUDMAX<=50000?3:BUDMAX<=100000?4:5;
    A.budget=[['~1만','1–3만','3–5만','5–10만','10만+'][lv-1]];
  }
  RULES.forEach(function(r){ if(r[0].test(t)){ var k=r[1],v=r[2];
    if(A[k] && A[k].indexOf(v)<0) A[k].push(v); } });
  // 부모님·가족 자리에는 데이트를 얹지 않는다
  if(A.sit.indexOf('가족')>-1){ var di=A.sit.indexOf('데이트'); if(di>-1) A.sit.splice(di,1); }
  if(PARTY){ A.cap=[PARTY<=2?'1–2명':PARTY<=4?'3–4명':PARTY<=9?'5–9명':'10명+']; }
  // 규칙에 안 걸린 낱말은 가게 이름·문구에서 직접 찾는다 (예: 생새우회, 뭉티기)
  t.split(/[\s,]+/).forEach(function(w){
    w=w.replace(/(에서|근처|맛집|추천|주변|으로|먹고싶|먹을만한|가고싶)/g,'').trim();
    if(w.length<2 || /동$|구$|^\d|시$|분$|명$|원$|만원|이하|이상|필수|오늘|내일|저녁|점심|아침/.test(w)) return;
    // 종류(cats) 규칙에 걸린 음식 이름(냉면 등)은 낱말 검색에도 살려둔다
    if(RULES.some(function(r){ return r[1]!=='cats' && r[0].test(w); })) return;
    if(NEEDLE.length<4 && NEEDLE.indexOf(w)<0) NEEDLE.push(w);
  });
  syncAll();
}

/* ── 결과 ── */
var SHOW=12, LOADING=false, lastQuery='';
function mustCheck(p){
  // 필수조건 하나라도 어긋나면 이유를 돌려준다 (null = 통과)
  // 확인 안 된 정보는 '만족'으로 치지 않는다 — 풀어주기(RELAX)를 켰을 때만 통과
  if(A.cats.length){
    var pt=ptypeOf(p);
    var foodAsk=['한식','중식','일식','분식','양식','고기'].some(function(x){return A.cats.indexOf(x)>-1;});
    if(foodAsk && pt!=='rest') return '음식점 아님';
    if(A.cats.indexOf('카페')>-1||A.cats.indexOf('디저트')>-1){ if(pt!=='cafe'&&pt!=='rest') return '카페 아님'; }
    if(A.cats.indexOf('뷰티')>-1 && pt!=='beauty') return '뷰티 아님';
    // 종류가 여러 개 잡히면 '전부'가 아니라 '하나라도' 맞으면 통과 (빙수+냉면 검색이 0곳 되는 것 방지)
    var real=A.cats.filter(function(c){ return c!=='신상'&&c!=='노포'; });
    if(real.length && !real.some(function(c){ return (p.cats||[]).indexOf(c)>-1; })) return '종류 불일치';
    if(A.cats.indexOf('노포')>-1 && (p.cats||[]).indexOf('노포')<0) return '노포 아님';
    if(A.cats.indexOf('신상')>-1 && (p.cats||[]).indexOf('신상')<0) return '신상 아님';
  }
  if(DONGQ){
    var inD=String(p.area||'').indexOf(DONGQ)===0;
    if(!inD){
      var c=dongCenter(DONGQ);
      var km=(c&&p.lat)?kmBetween(c,p):null;
      var lim=RELAX.dist?3:2;
      if(km===null||km>lim) return DONGQ+' 밖';
      p._km=km;
    } else p._km=0;
  }
  if(VISIT!=null){
    var o=openAtMin(p,VISIT);
    if(o===false) return '그 시간 영업 안 함';
    if(o===null && !RELAX.unkHours) return '영업시간 미확인';
  }
  if(A.fac.length){
    for(var i=0;i<A.fac.length;i++){
      var v=(p.fac||{})[FAC[A.fac[i]]];
      if(v===false) return A.fac[i]+' 안 됨';
      if(v!==true && !RELAX.unkFac) return A.fac[i]+' 미확인';
    }
  }
  if(BUDMAX!=null){
    if(p.budget==null){ if(!RELAX.unkBud) return '가격대 미확인'; }
    else if(budUpper(p.budget)>BUDMAX*1.34) return '예산 초과';
  }
  if(PARTY!=null && p.cap!=null && p.cap<PARTY) return '인원 수용 불가';
  if(A.gu.length && A.gu.indexOf(p.gu)<0 && !DONGQ) return '지역 밖';
  return null;
}
function mustActive(){
  return !!(A.cats.length||DONGQ||VISIT!=null||A.fac.length||BUDMAX!=null||PARTY!=null||A.gu.length);
}
function needleHay(p){ return p.n+' '+(p.cat||'')+' '+(p.v||'')+' '+(p.kcat||''); }
function results(){
  var n=nActive();
  var pool=P;
  if(mustActive()) pool=P.filter(function(p){ return !mustCheck(p); });
  if(NEEDLE.length){
    var hitP=pool.filter(function(p){ var hay=needleHay(p);
      return NEEDLE.some(function(w){ return hay.indexOf(w)>-1; }); });
    if(hitP.length) pool=hitP;                 // 낱말에 맞는 가게가 있으면 그쪽으로 좁힌다
    else if(!mustActive() && !A.sit.length) NEEDLE=[];   // 아무 데도 없는 낱말은 무시 (0곳 방지)
  }
  var arr=pool.map(function(p){ var r=score(p); r.p=p; return r; });
  if(n && !mustActive() && NEEDLE.length===0) arr=arr.filter(function(r){ return r.hit>0; });
  if(SORT==='info') arr.sort(function(a,b){ return pct(b.p)-pct(a.p) || b.sc-a.sc; });
  else arr.sort(function(a,b){
    var ka=a.p._km!=null?a.p._km:99, kb=b.p._km!=null?b.p._km:99;
    if(DONGQ && Math.abs(ka-kb)>0.01 && (ka===0||kb===0)) return ka-kb;   // 그 동네가 무조건 먼저
    return b.sc-a.sc;
  });
  return arr;
}
function statusOf(p){
  var o=openNow(p);
  if(o===true) return '<span class="stat open"><i></i>영업 중</span>';
  if(o===false) return '<span class="stat shut"><i></i>영업 종료</span>';
  return '';                        // 모를 땐 카드에 표시하지 않는다
}
function budText(p){ return p.budget?['~1만','1–3만','3–5만','5–10만','10만+'][p.budget-1]:null; }
function vLines(v){
  // '·' 구분과 문장 끝에서 줄을 바꾼다. 어중간한 줄바꿈보다 읽기 편하다.
  return String(v).split(/\s*·\s*/).join('<br>').replace(/\.\s+/g,'.<br>');
}
function cautionOf(p){
  // 정보가 빠졌다는 경고는 소음이라 카드 앞에서는 접는다. 폐업 안내만 남긴다.
  if(p.closed) return '폐업으로 확인된 곳입니다.';
  return null;
}
function facLine(p){
  var f=p.fac||{}, out=[];
  if(f.parking) out.push('주차'); if(f.reserve) out.push('예약');
  if(f.group) out.push('단체석'); if(f.room) out.push('룸');
  if(f.pet) out.push('반려동물');
  return out;
}
var SAVED=(function(){ try{ return JSON.parse(localStorage.getItem('odipick_saved')||'[]'); }catch(e){ return []; } })();
function isSaved(p){ return SAVED.indexOf(p.n)>-1; }
function toggleSave(p){
  var i=SAVED.indexOf(p.n);
  if(i>-1) SAVED.splice(i,1); else SAVED.push(p.n);
  try{ localStorage.setItem('odipick_saved',JSON.stringify(SAVED)); }catch(e){}

}

function openSheet(html, footHtml){
  try{ history.pushState({sheet:1}, ''); }catch(e){}

  sheet.style.transform=''; scrim.classList.add('on'); sheet.classList.add('on');
  document.body.style.overflow='hidden';
}
function reallyClose(){ scrim.classList.remove('on'); sheet.classList.remove('on');
  document.body.style.overflow=''; }
function closeSheet(after){
  // 시트를 닫으면 history.back() 이 뒤늦게 일어나 화면 전환을 되돌린다.
  // 그래서 화면을 바꿔야 하는 일은 되돌림이 끝난 뒤에 실행한다.
  reallyClose();
  var had=false;
  try{ had=!!(history.state && history.state.sheet); }catch(e){}
  if(!had){ if(typeof after==='function') after(); return; }
  if(typeof after==='function'){
    var h=function(){ removeEventListener('popstate',h); setTimeout(after,0); };
    addEventListener('popstate',h);
  }
  try{ history.back(); }catch(e){ if(typeof after==='function') after(); }
}

/* 손잡이를 끌어 높이 조절 */
(function(){
  var g=document.getElementById('grab'), y0=null, cur=0, raf=0;
  function paint(){ raf=0; sheet.style.transform='translateY('+cur+'px)'; }
  g.addEventListener('pointerdown',function(e){
    y0=e.clientY; cur=0; sheet.style.transition='none';
    g.setPointerCapture(e.pointerId);
  });
  g.addEventListener('pointermove',function(e){
    if(y0==null) return;
    cur=Math.max(0,e.clientY-y0);
    if(!raf) raf=requestAnimationFrame(paint);   // 프레임당 한 번만 그린다
  });
  function up(e){
    if(y0==null) return;
    var d=e.clientY-y0; y0=null;
    if(raf){ cancelAnimationFrame(raf); raf=0; }
    sheet.style.transition='';
    if(d>110){ sheet.style.transform=''; closeSheet(); }
    else sheet.style.transform='';
  }
  g.addEventListener('pointerup',up);
  g.addEventListener('pointercancel',up);
})();

function similarBlock(p){
  var mine=p.cats||[], dong=String(p.area||'').split(' ')[0];
  var sim=P.filter(function(x){
    if(x===p||x.closed) return false;
    if(ptypeOf(x)!==ptypeOf(p)) return false;

  }).map(function(x){
    var s=0;
    if(dong && String(x.area||'').indexOf(dong)===0) s+=3;
    else if(x.gu===p.gu) s+=1;
    if(x.src==='reel') s+=2;
    if(x.likes) s+=Math.min(2,x.likes/1000);
    return {x:x,s:s};
  }).sort(function(a,b){ return b.s-a.s; }).slice(0,4);
  if(!sim.length) return '';
  return '<div class="dsec"><h3>비슷한 곳</h3><div style="display:flex;flex-direction:column;gap:6px">'+

var FGROUPS=[
 {k:'gu',l:'지역',o:['서구','유성구','중구','동구','대덕구','대전근교']},
 {k:'sit',l:'동행 · 목적',o:['데이트','가족','친구모임','회식','혼밥','혼술','기념일','가성비','술자리']},
 {k:'cats',l:'종류',o:['한식','중식','일식','분식','양식','술집','고기','카페','디저트','뷰티','노포','신상']},
 {k:'budget',l:'1인 예산',o:['~1만','1–3만','3–5만','5–10만','10만+']},
 {k:'mood',l:'분위기',o:['조용한','예쁜','고급스러운','테라스','이국적','활기찬','캐주얼','깔끔한']},
 {k:'cap',l:'인원',o:['1–2명','3–4명','5–9명','10명+']},
 {k:'fac',l:'편의',o:['주차','예약가능','단체석','룸','새벽','아이의자','애견동반']},
 {k:'open',l:'영업',o:['1']},
 {k:'avoid',l:'제외할 것',o:['술집','노포','카페']}
];
function countFor(k,o){
  return P.filter(function(x){
    if(k==='sit') return (x.sit||[]).indexOf(o)>-1;
    if(k==='cats') return (x.cats||[]).indexOf(o)>-1;
    if(k==='mood') return (x.mood||[]).indexOf(o)>-1;
    if(k==='fac') return (x.fac||{})[FAC[o]]===true;
    if(k==='budget') return x.budget!=null && x.budget<=BUD[o];
    if(k==='cap') return x.cap!=null && x.cap>=CAP[o];
    if(k==='gu') return x.gu===o;
    if(k==='open') return openNow(x)===true;
    if(k==='avoid') return (x.cats||[]).indexOf(o)<0 && (x.sit||[]).indexOf(o)<0;
    return false;
  }).length;
}
function openFilter(){
  var html='<h2 class="dtitle" style="font-size:20px;margin:4px 0 6px">조건 고르기</h2>';
  FGROUPS.forEach(function(g){
    html+='<div class="fg"><div class="fgh">'+g.l+'</div><div class="fgc">';
    g.o.forEach(function(o){
      var n=countFor(g.k,o), label=(g.k==='open'?'지금 영업 중':o);
      html+='<button class="fc'+(n?'':' z')+'" type="button" data-k="'+g.k+'" data-val="'+o+'" '+
        'aria-pressed="'+(A[g.k].indexOf(o)>-1)+'">'+label+(n?'<span class="n">'+n+'</span>':'')+'</button>';
    });
    html+='</div></div>';
  });
  openSheet(html,
    '<button class="btn s" id="fReset">조건 초기화</button>'+
    '<button class="btn p" id="fApply">결과 보기</button>');
  body.querySelectorAll('.fc').forEach(function(b){
    b.addEventListener('click',function(){
      var k=b.dataset.k,v=b.dataset.val,i=A[k].indexOf(v);
      if(i>-1) A[k].splice(i,1); else A[k].push(v);
      b.setAttribute('aria-pressed',String(A[k].indexOf(v)>-1));
    });
  });
  document.getElementById('fReset').addEventListener('click',function(){
    KEYS.forEach(function(k){ A[k]=[]; });
    body.querySelectorAll('.fc').forEach(function(b){ b.setAttribute('aria-pressed','false'); });
  });
  document.getElementById('fApply').addEventListener('click',function(){

/* ── 지도 (구 경계 + 공주픽 핀) ── */
function buildMap(host, big){
  var ns='http://www.w3.org/2000/svg';
  host.innerHTML='';
  var svg=document.createElementNS(ns,'svg');
  svg.setAttribute('viewBox', big?GU_BOX:'-34 -22 368 430'); svg.setAttribute('class','gsvg');
  svg.setAttribute('role','img'); svg.setAttribute('aria-label','대전 지역 지도');
  if(big) svg.style.maxWidth='min(86vw, 420px)';
  Object.keys(GU_SHAPES).forEach(function(g){
    var pth=document.createElementNS(ns,'path');
    pth.setAttribute('d',GU_SHAPES[g]); pth.setAttribute('class','gu');
    pth.setAttribute('data-gu',g); pth.setAttribute('tabindex','0');
    pth.setAttribute('aria-label',g);
    pth.addEventListener('click',function(){ toggle('gu',g); syncMap(); if(!big) homeList(); });
    svg.appendChild(pth);
  });
  var pins=document.createElementNS(ns,'g');
  var plist = big
    ? results().map(function(r){ return r.p; }).filter(function(x){ return x.src==='reel' && x.lat; })
    : [];   // 홈 지도는 깨끗하게 — 테마를 고르면 번호 핀이 뜬다
  plist.forEach(function(x){
    var px=(x.lng-GU_PROJ.minx)*GU_PROJ.sx;
    var py=GU_PROJ.h-((x.lat-GU_PROJ.miny)*GU_PROJ.sx/GU_PROJ.cos);
    if(px<0||py<0||px>GU_PROJ.w||py>GU_PROJ.h) return;
    var g2=document.createElementNS(ns,'g');
    g2.setAttribute('class','gping'); g2.setAttribute('tabindex','0');
    g2.setAttribute('role','button'); g2.setAttribute('aria-label',x.n+' 보기');
    var hit=document.createElementNS(ns,'circle');
    hit.setAttribute('cx',px.toFixed(1)); hit.setAttribute('cy',(py-6).toFixed(1));
    hit.setAttribute('r', big?'11':'14'); hit.setAttribute('fill','transparent');
    g2.appendChild(hit);
    if(x.src==='reel'){
      var im=document.createElementNS(ns,'image');
      im.setAttribute('href',PIN_IMG);
      var w=big?15:18, h=big?16:19;
      im.setAttribute('x',(px-w/2).toFixed(1)); im.setAttribute('y',(py-h).toFixed(1));
      im.setAttribute('width',w); im.setAttribute('height',h);
      g2.appendChild(im);
    } else {
      var dot=document.createElementNS(ns,'circle');
      dot.setAttribute('cx',px.toFixed(1)); dot.setAttribute('cy',py.toFixed(1));
      dot.setAttribute('r','3.6'); dot.setAttribute('class','mdot');
      g2.appendChild(dot);
    }
    var act = big ? function(){ mapCard(x); } : function(){ pinPreview(x); };
    g2.addEventListener('click',function(ev){ ev.stopPropagation(); act(); });
    g2.addEventListener('keydown',function(ev){ if(ev.key==='Enter') act(); });
    pins.appendChild(g2);
  });
  svg.appendChild(pins);
  // 대전 표시 + 주변 도시 (방향만 맞춘 안내 라벨)
  // 도시 이름 라벨은 뺐다 — 구 이름만으로 충분
  [['세종', 0.16, -0.02],['청주', 0.95, 0.10],['공주', -0.10, 0.42],
   ['논산', 0.10, 1.03],['옥천', 1.02, 0.72],['금산', 0.62, 1.05]].forEach(function(n){
    var t2=document.createElementNS(ns,'text');
    t2.setAttribute('x', (GU_PROJ.w*n[1]).toFixed(0));
    t2.setAttribute('y', (GU_PROJ.h*n[2]).toFixed(0));
    t2.setAttribute('class','gnear'); t2.textContent=n[0];
    svg.appendChild(t2);
  });

  Object.keys(GU_SHAPES).forEach(function(g){
    var t=document.createElementNS(ns,'text');
    t.setAttribute('x',GU_LABEL[g][0]); t.setAttribute('y',GU_LABEL[g][1]);
    t.setAttribute('class','gt'); t.setAttribute('data-gu',g); t.textContent=g;
    t.addEventListener('click',function(){ toggle('gu',g); syncMap(); if(!big) homeList(); });
    svg.appendChild(t);
  });
  host.appendChild(svg);
}

/* ── 카카오맵: 배포 환경에서 실제 지도로 전환된다.
   미리보기(claude.ai)는 외부 지도 스크립트를 차단하므로 SVG 지도가 대신 나온다. */
var KAKAO_JS_KEY="5ae0f2c7b47e2cadb73aa52b04043153";
var kakaoReady=null;
function loadKakao(){
  if(kakaoReady) return kakaoReady;
  kakaoReady=new Promise(function(done){
    var t=document.createElement('script');
    t.src='https://dapi.kakao.com/v2/maps/sdk.js?appkey='+KAKAO_JS_KEY+'&autoload=false&libraries=clusterer';
    var to=setTimeout(function(){ done(null); },3000);
    t.onload=function(){ clearTimeout(to); kakao.maps.load(function(){ done(kakao); }); };
    t.onerror=function(){ clearTimeout(to); done(null); };
    document.head.appendChild(t);
  });
  return kakaoReady;
}
var kmap=null, kmarkers=[];
function drawKakao(kk){
  var c=document.getElementById('mapCanvas');
  c.innerHTML='<div id="kmapEl" style="position:absolute;inset:0"></div>';
  kmap=new kk.maps.Map(document.getElementById('kmapEl'),
    {center:new kk.maps.LatLng(36.3504,127.3845), level:7});
  var img=new kk.maps.MarkerImage(PIN_IMG, new kk.maps.Size(26,28),
    {offset:new kk.maps.Point(13,28)});
  kmarkers.forEach(function(m){ m.setMap(null); }); kmarkers=[];
  // 현재 필터·검색 결과를 그대로 지도에 (공주픽만이 아니라 전부)
  var arr=results().map(function(r){ return r.p; })
    .filter(function(x){ return x.lat; });
  if(MTHEME){
    arr=arr.filter(function(x){
      if(MTHEME.f) return MTHEME.f(x);
      var hay=x.n+' '+(x.cat||'')+' '+(x.v||'')+' '+(x.kcat||'');
      return MTHEME.re.test(hay);
    }).sort(function(a,b){
      return (b.src==='reel')-(a.src==='reel') || (b.likes||0)-(a.likes||0);
    }).slice(0,15);
    // 순위 배지로 찍는다
    kmarkers.forEach(function(m){ m.setMap(null); }); kmarkers=[];
    arr.forEach(function(x,i){
      var el=document.createElement('button');
      el.type='button';
      el.style.cssText='min-width:30px;height:30px;border-radius:50%;border:2.5px solid #fff;'+
        'background:'+(i<3?'var(--brand-d)':'var(--brand)')+';color:#fff;font-weight:800;font-size:13px;'+
        'box-shadow:0 2px 6px rgba(0,0,0,.25);display:grid;place-items:center;padding:0 4px';
      el.textContent=(i+1);
      el.addEventListener('click',function(){ mapCard(x); });
      var ov=new kk.maps.CustomOverlay({position:new kk.maps.LatLng(x.lat,x.lng), content:el, yAnchor:1.1});
      ov.setMap(kmap); kmarkers.push(ov);
    });
    var redo=document.getElementById('redoBtn');
    redo.hidden=false; redo.innerHTML=ic(I.search,14)+MTHEME.t+' '+arr.length+'곳';
    if(arr.length){
      var bd=new kk.maps.LatLngBounds();
      arr.forEach(function(x){ bd.extend(new kk.maps.LatLng(x.lat,x.lng)); });
      kmap.setBounds(bd,60,30,60,30);
    }
    return;
  }
  arr=arr.slice(0,300);
  var mks=arr.map(function(x){
    var mk=new kk.maps.Marker({position:new kk.maps.LatLng(x.lat,x.lng), image:img, title:x.n});
    kk.maps.event.addListener(mk,'click',function(){ mapCard(x); });
    kmarkers.push(mk); return mk;
  });
  if(kk.maps.MarkerClusterer){
    new kk.maps.MarkerClusterer({map:kmap, markers:mks, averageCenter:true, minLevel:6,
      styles:[{width:'42px',height:'42px',background:'#FF3F7F',borderRadius:'21px',
        color:'#fff',textAlign:'center',lineHeight:'42px',fontWeight:'800',
        border:'3px solid #fff',boxShadow:'0 3px 10px rgba(216,27,96,.4)'}]});
  } else { mks.forEach(function(mk){ mk.setMap(kmap); }); }
}

/* 추천 줄 후보의 실제 결과 수 — 데이터에 없는 추천은 아예 안 보여준다 */
function rowCount(set){
  var pool=P.filter(function(x){ return !x.closed; });
  if(set.q){
    var toks=set.q.split(/\s+/);
    return pool.filter(function(x){
      var hay=x.n+' '+(x.cat||'')+' '+(x.v||'')+' '+(x.kcat||'');
      return toks.some(function(w){ return hay.indexOf(w)>-1; });
    }).length;
  }
  return pool.filter(function(x){
    if(set.sit && !set.sit.some(function(s){ return (x.sit||[]).indexOf(s)>-1; })) return false;
    if(set.cats && !set.cats.some(function(c){ return (x.cats||[]).indexOf(c)>-1; })) return false;
    if(set.mood && !set.mood.some(function(mo){ return (x.mood||[]).indexOf(mo)>-1; })) return false;
    if(set.src && x.src!==set.src[0]) return false;
    if(set.open && openNow(x)!==true) return false;
    return true;
  }).length;
}
