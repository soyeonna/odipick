name: 릴스 동기화

# DISABLED 2026-09-10: 인스타가 로그인 없는 조회를 막아 자동 동기화가 실패한다.
# 소연님 크롬으로 읽어오는 방식으로 대체 (docs/릴스-업데이트-크롬으로.md)
on:
  workflow_dispatch:        # 수동 실행 버튼

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 필요한 것 설치
        run: pip install --quiet pillow

      - name: 릴스 가져오기
        run: python3 scripts/sync_reels_public.py

      - name: 바뀐 게 있으면 커밋
        run: |
          if [ -n "$(git status --porcelain index.html data/reels_public.json)" ]; then
            git config user.name  "odipick-bot"
            git config user.email "bot@odipick.local"
            git add index.html data/reels_public.json
            git commit -m "릴스 동기화 $(date +%Y-%m-%d)"
            git push
          else
            echo "변경 없음"
          fi
