name: 릴스 동기화

on:
  schedule:
    - cron: '0 21 * * *'   # 매일 06:00 KST
  workflow_dispatch:        # 수동 실행 버튼

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 필요한 것 설치
        run: pip install --quiet pillow

      - name: 릴스 가져오기
        run: python3 scripts/sync_reels_public.py

      - name: 바뀐 게 있으면 커밋
        run: |
          if [ -n "$(git status --porcelain index.html data/reels_public.json)" ]; then
            git config user.name  "odipick-bot"
            git config user.email "bot@odipick.local"
            git add index.html data/reels_public.json
            git commit -m "릴스 동기화 $(date +%Y-%m-%d)"
            git push
          else
            echo "변경 없음"
          fi
