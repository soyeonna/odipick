function shopsFor(th, needPhoto, n){
  var pool = needPhoto ? D.places : D.lite;
  var arr=pool.filter(function(x){
    if(th.f) return th.f(x);
    return th.re.test(x.n+' '+(x.cat||'')+' '+(x.v||''));
  });
  arr.sort(function(a,b){ return (b.feat?1:0)-(a.feat?1:0) || (b.pick?1:0)-(a.pick?1:0) || (b.views||0)-(a.views||0); });
  var seen={}, out=[];
  arr.forEach(function(x){ if(seen[x.n]) return; seen[x.n]=1; out.push(x); });

function proj(x){
  var px=(x.lng-GU_PROJ.minx)*GU_PROJ.sx;
  var py=GU_PROJ.h-((x.lat-GU_PROJ.miny)*GU_PROJ.sx/GU_PROJ.cos);
  return [px,py];
}
function mapSVG(marks){
  var s='<svg class="map" viewBox="-30 -20 360 426">';
  Object.keys(GU_SHAPES).forEach(function(g){ s+='<path class="gu" d="'+GU_SHAPES[g]+'"/>'; });

  return s+'</svg>';
}
function esc(t){ return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;'); }

function renderBubble(){
  var shops=shopsFor(THEME,true,8);
  var card=document.getElementById('card');
  // 지도 위 점 + 버블로 향하는 선
  var marks=[], bubs='';
  var cx=150, cy=193;
  var used=[];
  shops.forEach(function(x,i){
    var p=proj(x);
    var ang=Math.atan2(p[1]-cy, p[0]-cx);
    // 카드 좌표(%)로: 지도는 카드의 50%,54% 중심 56% 폭
    var mx=50+(p[0]-cx)/360*56, my=54+(p[1]-cy)/426*56*(426/360)*(5/4)*0.8;
    var R=[34,42][i%2];
    var bx=50+Math.cos(ang)*R*0.92, by=54+Math.sin(ang)*R*0.86;
    bx=Math.max(12,Math.min(88,bx)); by=Math.max(24,Math.min(84,by));
    used.forEach(function(u){

    marks.push('<circle class="pt" cx="'+p[0]+'" cy="'+p[1]+'" r="5"/>');

      '<img src="'+D.thumbs[x.ph]+'" alt="">'+
      '<span class="bl">'+esc(x.n)+'<em>'+esc(x.area||x.gu||'')+'</em></span></div>';
  });

    '<span class="badge">대전공주가 다녀온 곳만</span>'+
    '<h1 class="ct" contenteditable spellcheck="false">대전 '+esc(THEME.t)+'<small>MATZIP MAP</small></h1>'+

}
